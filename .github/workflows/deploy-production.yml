name: Upgrade retained shortlink resources to production
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Guarded production transition stage
        type: choice
        options: [prepare, stop-legacy, final-scan, backup, disable-sync, cutover, verify]
        required: true
        default: prepare
      confirm_target:
        description: 'Type: upgrade owned shortlink-new to production gfw.mom and gfw.lat'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: shortlink-new-cloudflare
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: shortlink-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE_ID_GFW_MOM: ${{ vars.CF_ZONE_ID_GFW_MOM }}
      CF_ZONE_ID_GFW_LAT: ${{ vars.CF_ZONE_ID_GFW_LAT }}
      CF_ZONE_ID_LILY_LAT: ${{ vars.CF_ZONE_ID_LILY_LAT }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      LEGACY_WORKER_NAME: ${{ vars.LEGACY_WORKER_NAME }}
      LEGACY_KV_NAMESPACE_ID: ${{ vars.LEGACY_KV_NAMESPACE_ID }}
      PUBLIC_HOSTNAME: ${{ vars.PUBLIC_HOSTNAME }}
      ADMIN_HOSTNAME: ${{ vars.ADMIN_HOSTNAME }}
      APP_ENV: ${{ vars.APP_ENV }}
      ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
      CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      CONFIRM_TARGET: ${{ inputs.confirm_target }}
      CUTOVER_STAGE: ${{ inputs.stage }}
      WRANGLER_SEND_METRICS: 'false'
      PRODUCTION_RELEASE_AUTHORIZED: ${{ vars.PRODUCTION_RELEASE_AUTHORIZED }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Apply reviewed fixed scope through manual dispatch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          CF_DOMAIN_READ_TOKEN: ${{ secrets.CF_DOMAIN_READ_TOKEN }}
          CF_ANALYTICS_READ_TOKEN: ${{ secrets.CF_ANALYTICS_READ_TOKEN }}
        run: |
          if [ "$CUTOVER_STAGE" = cutover ]; then
            node scripts/deploy.mjs production
          else
            node scripts/production-cutover.mjs
          fi
