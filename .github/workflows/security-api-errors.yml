name: Apply reviewed exact API error exception
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Apply the reviewed exact API exception, or restore its original rule'
        type: choice
        options:
          - apply
          - rollback
        default: apply
        required: true
      confirm_target:
        description: 'Apply: apply reviewed exact shortlink-new API error exception; Rollback: restore reviewed exact shortlink-new API error exception'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: shortlink-new-cloudflare
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: shortlink-test
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE_ID_GFW_MOM: ${{ vars.CF_ZONE_ID_GFW_MOM }}
      CF_ZONE_ID_LILY_LAT: ${{ vars.CF_ZONE_ID_LILY_LAT }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      LEGACY_WORKER_NAME: ${{ vars.LEGACY_WORKER_NAME }}
      LEGACY_KV_NAMESPACE_ID: ${{ vars.LEGACY_KV_NAMESPACE_ID }}
      PUBLIC_HOSTNAME: ${{ vars.PUBLIC_HOSTNAME }}
      ADMIN_HOSTNAME: ${{ vars.ADMIN_HOSTNAME }}
      APP_ENV: ${{ vars.APP_ENV }}
      ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
      CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      CONFIRM_TARGET: ${{ inputs.confirm_target }}
      CUSTOM_ERROR_OPERATION: ${{ inputs.operation }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify checkpoint and update only reviewed exact API expression
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/security-api-errors.mjs
