name: Migrate legacy KV to new test D1
on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: 'Type: read old KV and migrate owned test D1 only'
        type: string
        required: true
      resume_run:
        description: 'Existing incomplete run UUID; empty starts a fresh incremental full scan'
        type: string
        default: ''
      max_pages:
        description: '100 keys/page; bounded work; incomplete runs retain checkpoint'
        type: choice
        options: ['100', '10', '1']
        default: '100'
permissions:
  contents: read
concurrency:
  group: shortlink-new-cloudflare
  cancel-in-progress: false
jobs:
  apply:
    if: false # Retired: this original test workflow cannot modify the production Worker.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: shortlink-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE_ID_GFW_MOM: ${{ vars.CF_ZONE_ID_GFW_MOM }}
      CF_ZONE_ID_GFW_LAT: ${{ vars.CF_ZONE_ID_GFW_LAT }}
      CF_ZONE_ID_LILY_LAT: ${{ vars.CF_ZONE_ID_LILY_LAT }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      LEGACY_WORKER_NAME: ${{ vars.LEGACY_WORKER_NAME }}
      LEGACY_KV_NAMESPACE_ID: ${{ vars.LEGACY_KV_NAMESPACE_ID }}
      PUBLIC_HOSTNAME: ${{ vars.PUBLIC_HOSTNAME }}
      ADMIN_HOSTNAME: ${{ vars.ADMIN_HOSTNAME }}
      APP_ENV: ${{ vars.APP_ENV }}
      ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
      CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      CONFIRM_TARGET: ${{ inputs.confirm_target }}
      WRANGLER_SEND_METRICS: 'false'
      MIGRATION_RESUME_RUN: ${{ inputs.resume_run }}
      MIGRATION_MAX_PAGES: ${{ inputs.max_pages }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Apply reviewed fixed scope through manual dispatch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/migrate-legacy.mjs
